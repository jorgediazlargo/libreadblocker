name: CI

on:
  push:
    branches: [main]
  pull_request:

# El token solo puede leer el repo: un PR o una dependencia maliciosa no puede escribir en él.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Acciones fijadas por SHA de commit: una etiqueta se puede mover, un SHA no.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Incluye test/security.test.ts: invariantes del manifest, de las reglas y de los selectores.
      - run: pnpm test
      - run: pnpm build
