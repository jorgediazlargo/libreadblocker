<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Largo Ad Blocker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/32.png" width="20" height="20" alt="">
    <span class="name">Largo Ad Blocker</span>
  </header>
  <main>
    <div id="host" class="host"></div>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="track"><span class="thumb"></span></span>
      <span id="status" data-i18n="siteOn">Blocking on for this site</span>
    </label>
    <div class="count"><strong id="count">—</strong> <span id="count-label" data-i18n="blockedMany">requests blocked on this tab</span></div>
  </main>
  <section class="modules">
    <label class="switch">
      <input type="checkbox" id="links" data-module="links">
      <span class="track"><span class="thumb"></span></span>
      <span data-i18n="moduleLinks">Strip tracking from links</span>
    </label>
    <label class="switch">
      <input type="checkbox" id="cookies" data-module="cookies">
      <span class="track"><span class="thumb"></span></span>
      <span data-i18n="moduleCookies">Reject cookie banners</span>
    </label>
  </section>
  <footer>
    <span id="lists"></span>
    <a href="https://github.com/jorgediazlargo/libreadblocker/blob/main/ATTRIBUTION.md" target="_blank" rel="noopener" data-i18n="licenses">Licenses</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
